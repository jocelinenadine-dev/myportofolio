<div id="add-experience-modal"
     class="experience-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="add-experience-modal-title">
    <button type="button"
            class="experience-form-modal__backdrop"
            popovertarget="add-experience-modal"
            popovertargetaction="hide"
            aria-label="Tutup form tambah pengalaman"></button>

    <div class="experience-form-modal__content">
        <button type="button"
                class="experience-form-modal__close"
                popovertarget="add-experience-modal"
                popovertargetaction="hide"
                aria-label="Tutup form tambah pengalaman">&times;</button>

        <h2 id="add-experience-modal-title" style="margin: 0 2.5rem 1.25rem 0; font-family: var(--font-heading); font-size: 1.5rem; color: var(--ink-title); font-weight: 800;">Tambah Pengalaman Baru</h2>
        
        <form id="experience-form"
              method="post"
              action="{% url 'main:create_experience' %}"
              class="experience-form custom-bento-form"
              style="padding: 0; background: transparent; border: none;">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <p class="form-error" style="color: #DC2626; font-size: 0.82rem; margin-top: 0.25rem;">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}
            <div class="experience-form-modal__actions">
                <button type="button"
                        class="button-secondary"
                        style="padding: 0.65rem 1.25rem; border-radius: var(--radius-pill); font-family: var(--font-heading); font-weight: 700; cursor: pointer;"
                        popovertarget="add-experience-modal"
                        popovertargetaction="hide">Batal</button>
                <button type="submit"
                        class="button-add-pill"
                        style="border: none; cursor: pointer;">Tambah Pengalaman</button>
            </div>
        </form>
    </div>
</div>
