<div class="award-card-actions">
    <button type="button"
            class="button-delete-pill"
            popovertarget="delete-award-{{ award.id }}"
            aria-label="Hapus {{ award.title }}"
            title="Hapus Penghargaan">
        Hapus
    </button>
</div>

<div id="delete-award-{{ award.id }}"
     class="project-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-award-title-{{ award.id }}">
    <button type="button"
            class="project-delete-modal__backdrop"
            popovertarget="delete-award-{{ award.id }}"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus"></button>
    <div class="project-delete-modal__content">
        <button type="button"
                class="project-delete-modal__close"
                popovertarget="delete-award-{{ award.id }}"
                popovertargetaction="hide"
                aria-label="Tutup konfirmasi hapus">&times;</button>
        <h2 id="delete-award-title-{{ award.id }}" class="modal-heading">Hapus Penghargaan?</h2>
        <p class="modal-body-text">
            Apakah Anda yakin ingin menghapus <strong>{{ award.title }}</strong> ({{ award.rank }}) dari daftar portofolio?
        </p>
        <div class="project-delete-modal__actions">
            <button type="button"
                    class="button-modal-cancel"
                    popovertarget="delete-award-{{ award.id }}"
                    popovertargetaction="hide">Batal</button>
            <form method="post" action="{% url 'main:delete_award' award.id %}" style="margin: 0;">
                {% csrf_token %}
                <button type="submit" class="button-modal-danger">Ya, Hapus</button>
            </form>
        </div>
    </div>
</div>
